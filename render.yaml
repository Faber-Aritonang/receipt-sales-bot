# ============================================================================
# Render Blueprint — deploy Sales Canvas Bot ke Render (plan STARTER berbayar).
#
# Dua Web Service (Docker, plan starter):
#   sales-bot-api      : FastAPI + dashboard + bot Telegram  (port 8000)
#   sales-bot-bridge   : bridge WhatsApp (Baileys)           (port 3100)
#
# Keduanya memakai PERSISTENT DISK (1 GB) sehingga data runtime (DB SQLite,
# uploads, session WhatsApp, whitelist, id pesan) TIDAK hilang saat
# restart/redeploy.
#
# CARA DEPLOY (sekali):
#   1. Pastikan repo ini sudah ter-push ke GitHub.
#   2. Buka https://dashboard.render.com/blueprints -> "New Blueprint Instance"
#      -> pilih repo ini. Render membaca render.yaml ini dan membuat kedua service.
#   3. Isi environment variable bertanda "sync: false" (isi manual) di dashboard
#      Render untuk masing-masing service:
#        api     : TELEGRAM_BOT_TOKEN, BRIDGE_WEBHOOK_SECRET, BRIDGE_URL,
#                  DASHBOARD_PASSWORD (DASHBOARD_USERNAME default kozoadmin)
#        bridge  : PYTHON_API_URL, BRIDGE_WEBHOOK_SECRET,
#                  (opsional) WHATSAPP_ALLOWED_NUMBERS, QR_PASSWORD
#      BRIDGE_WEBHOOK_SECRET harus SAMA di kedua service.
#   4. Setelah service dibuat, buka log bridge dan scan QR WhatsApp, atau buka
#      https://<nama-bridge>.onrender.com/qr di browser.
#
# CATATAN:
#   - Plan starter = berbayar (mulai ~$7/bln per service). Free tier TIDAK
#     mendukung persistent disk, jadi jangan turunkan plan ke "free" bila
#     ingin data tetap tersimpan.
#   - Service tetap "tidur" setelah ~15 menit tanpa lalu lintas masuk pada
#     plan starter: koneksi WhatsApp bisa putus saat tidur dan bot tidak
#     menerima pesan sampai service dibangunkan (buka URL-nya). Untuk bot
#     24 jam penuh, pertimbangkan VPS.
# ============================================================================

services:
  # ---------- API + dashboard + bot Telegram ----------
  - type: web
    name: sales-bot-api
    runtime: docker
    repo: https://github.com/Faber-Aritonang/receipt-sales-bot
    branch: main
    plan: starter
    dockerfilePath: ./Dockerfile
    port: 8000
    healthCheckPath: /api/health
    envVars:
      # Token bot Telegram dari @BotFather — isi manual di dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Rahasia bersama bridge <-> api — isi manual & harus SAMA dengan bridge
      - key: BRIDGE_WEBHOOK_SECRET
        sync: false
      # URL bridge WhatsApp — isi manual: https://<nama-bridge>.onrender.com
      - key: BRIDGE_URL
        sync: false
      # (Opsional) Username & password dashboard — kosongkan password = tanpa login
      - key: DASHBOARD_USERNAME
        value: kozoadmin
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # Database SQLite & uploads disimpan di persistent disk
      - key: DATA_DIR
        value: /app/data
    # Persistent disk agar DB & uploads tidak hilang saat restart/redeploy
    disk:
      name: api-data
      mountPath: /app/data
      sizeGB: 1

  # ---------- Bridge WhatsApp (Baileys) ----------
  - type: web
    name: sales-bot-bridge
    runtime: docker
    repo: https://github.com/Faber-Aritonang/receipt-sales-bot
    branch: main
    plan: starter
    dockerfilePath: ./whatsapp-bridge/Dockerfile
    dockerContext: whatsapp-bridge
    port: 3100
    healthCheckPath: /health
    envVars:
      # URL server API — isi manual: https://<nama-api>.onrender.com
      - key: PYTHON_API_URL
        sync: false
      # Rahasia bersama — isi manual & harus SAMA dengan api
      - key: BRIDGE_WEBHOOK_SECRET
        sync: false
      # (Opsional) Whitelist nomor yang boleh memakai bot (format 628xxx, pisah koma)
      - key: WHATSAPP_ALLOWED_NUMBERS
        sync: false
      # (Opsional) Password halaman QR — kosongkan = terbuka
      - key: QR_PASSWORD
        sync: false
      # Session WhatsApp, whitelist & id pesan disimpan di persistent disk
      - key: BRIDGE_DATA_DIR
        value: /app/data
    # Persistent disk agar session WhatsApp & whitelist tidak hilang saat restart
    disk:
      name: bridge-data
      mountPath: /app/data
      sizeGB: 1
